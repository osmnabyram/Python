<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A terminal runs one of the Python automation scripts step by step.">
  <style>
    :root{--ink:#1b1b1f;--muted:#6b7280;--line:#c7cad1;--accent:#e53935;--accent2:#2f9e44;--panel:#f3f0f1;--panelln:#d9c3c4;}
    @media (prefers-color-scheme:dark){:root{--ink:#e8e8ea;--muted:#9aa0a6;--line:#3a3d44;--accent:#e53935;--accent2:#51cf66;--panel:#1b1b1f;--panelln:#7f1d1d;}}
    .ink{fill:var(--ink)} .muted{fill:var(--muted)} .ok{fill:var(--accent2)}
    .ln{stroke:var(--line);stroke-width:2;fill:none} .acc{fill:var(--accent)} .accs{stroke:var(--accent);fill:none}
    .oks{stroke:var(--accent2);fill:none}
    .title{font-size:13px;font-weight:600;letter-spacing:.3px} .lbl{font-size:13px;font-weight:600}
    .sub{font-size:10.5px} .mono{font-family:Consolas,monospace;font-size:12px}
    .dotA{animation:dotA 4s linear infinite}
    @keyframes dotA{0%{transform:translateX(0);opacity:0}6%{opacity:1}30%{transform:translateX(130px);opacity:1}34%{transform:translateX(130px);opacity:0}100%{transform:translateX(130px);opacity:0}}
    .dotB{animation:dotB 4s linear infinite}
    @keyframes dotB{0%,52%{transform:translateX(0);opacity:0}58%{opacity:1}82%{transform:translateX(130px);opacity:1}86%{opacity:0}100%{opacity:0}}
    .glow{animation:glow 4s ease-in-out infinite}
    @keyframes glow{0%,30%{opacity:0}40%{opacity:1}52%{opacity:1}62%,100%{opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
    .blink{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .sweep{transform-box:fill-box;transform-origin:center;animation:sweep 2.6s linear infinite}
    @keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .bolt{animation:bolt 4s ease infinite}
    @keyframes bolt{0%,34%{opacity:0}40%{opacity:1}48%{opacity:.2}54%{opacity:1}60%,100%{opacity:0}}
    .fill{animation:fill 4s ease-in-out infinite}
    @keyframes fill{0%,10%{width:0}45%{width:120px}90%{width:120px}100%{width:0}}
    .s1{animation:seq 4s infinite} .s2{animation:seq 4s infinite} .s3{animation:seq 4s infinite} .s4{animation:seq 4s infinite}
    @keyframes seq{0%{opacity:0;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
    .s1{animation-delay:.6s} .s2{animation-delay:1.3s} .s3{animation-delay:2.0s} .s4{animation-delay:2.7s}
    .s1,.s2,.s3,.s4{opacity:0;animation-fill-mode:forwards;animation-iteration-count:1}
    .type{clip-path:inset(0 100% 0 0);animation:type 4s ease-in-out infinite}
    @keyframes type{0%,15%{clip-path:inset(0 100% 0 0)}55%{clip-path:inset(0 0 0 0)}92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
  </style>
  <text x="410" y="24" text-anchor="middle" class="title muted">Automation and scripts</text>
  <rect x="150" y="70" width="520" height="170" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/><line x1="150" y1="98" x2="670" y2="98" class="ln"/><circle cx="168" cy="84" r="4" class="acc"/><circle cx="182" cy="84" r="4" class="muted" fill="currentColor"/><circle cx="196" cy="84" r="4" class="ok"/><text x="170" y="134" text-anchor="start" class="mono ink">$ python randevu_bot.py</text><g class="s1"><text x="170" y="162" text-anchor="start" class="mono muted">[+] selenium started</text></g><g class="s2"><text x="170" y="186" text-anchor="start" class="mono muted">[+] form filled</text></g><g class="s3"><text x="170" y="210" text-anchor="start" class="mono ok">[ok] done</text></g><rect class="blink acc" x="170" y="222" width="8" height="2"/>
</svg>
